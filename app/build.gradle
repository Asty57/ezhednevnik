plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'kz.ezhednevnik.app'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.ezhednevnik.app'
        minSdk 29
        targetSdk 34
        versionCode buildNumber
        versionName "1.2.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'ezhednevnik'
            keyAlias 'ezhednevnik'
            keyPassword 'ezhednevnik'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
