function switchProfile(id){
  const a=ACCOUNTS.find(x=>x.id===id); if(!a) return;
  PROFILE=a; try{ localStorage.setItem('previewLogin', a.login||''); }catch(e){}
  if(isEmployeeOnly()) location.hash='tasks'; else { renderProfile(); renderTabbar(); }
  renderTabbar();
}
function doLogout(){
  try{ localStorage.removeItem('previewLogin'); }catch(e){}
  try{ if(window.Android && window.Android.logout){ window.Android.logout(); return; } }catch(e){}
  toast('Выход недоступен');
}

/* Админ: список пользователей */
async function refreshUsers(){ toast('Обновляю…'); try{ const ps=[]; if(typeof loadAccounts==='function') ps.push(loadAccounts()); ps.push(touchPresence()); await Promise.all(ps); }catch(e){} renderUsers(); toast('Обновлено'); }
function renderUsers(){
  let html = `<div class="view"><header><button class="icon-btn" onclick="location.hash='profile'">←</button><h1>Пользователи<div class="sub">${ACCOUNTS.length} аккаунтов</div></h1></header>`;
  html += `<button class="tbtn" style="margin-bottom:10px;width:100%" onclick="refreshUsers()">🔄 Обновить</button><div class="menu">`;
  ACCOUNTS.forEach(a=>{
    const online = isOnline(a.login) || isMe(a);
    const ls = lastSeen(a.login);
    const lsTxt = (!online && ls) ? ' · был(а) '+new Date(ls).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    html += `<button class="mbtn" onclick="editUser('${a.id}')"><span class="ic">${online?'🟢':'👤'}</span><span class="t">${a.name}<span class="s">${a.login?'@'+a.login:'логин не задан'} · ${rolesText(a)}${online?' · в сети':lsTxt}</span></span><span class="arrow">›</span></button>`;
  });
  html += `</div>
    <div class="sys" style="margin-top:16px">Добавить аккаунт</div>
    <div class="addrow"><input id="newAcc" placeholder="Имя сотрудника" onkeydown="if(event.key==='Enter')addUser()"><button onclick="addUser()">＋</button></div>
    <div class="foot">🟢 — кто сейчас в сети (приложение открыто за последние 2 минуты). Нажми на аккаунт, чтобы задать логин, роль, пароль или удалить.</div>
  </div>`;
  app.innerHTML = html;
}
function addUser(){
  const inp=document.getElementById('newAcc'); const v=(inp.value||'').trim(); if(!v) return;
  ACCOUNTS.push({id:'u'+Date.now(), name:v, login:'', roles:['Сотрудник'], pass:''}); saveAccounts(); renderUsers();
}
function editUser(id){ state.editId=id; location.hash='profile-user'; }
function renderEditUser(){
  const a=ACCOUNTS.find(x=>x.id===state.editId);
  if(!a){ location.hash='profile-users'; return; }
  app.innerHTML = `<div class="view">
    <header><button class="icon-btn" onclick="location.hash='profile-users'">←</button><h1>${a.name}<div class="sub">Настройка аккаунта</div></h1></header>
    <div class="sys">Имя</div><input class="naryad" value="${(a.name||'').replace(/"/g,'&quot;')}" oninput="updUser('name',this.value)">
    <div class="sys" style="margin-top:14px">Логин</div><input class="naryad" placeholder="например ivanov" value="${(a.login||'').replace(/"/g,'&quot;')}" oninput="updUser('login',this.value.trim().toLowerCase())">
    <div class="sys" style="margin-top:14px">Роли (до 2)</div>
    <div class="grp" style="padding:6px 12px">${['Администратор','Начальник','Инженер','Сотрудник'].map(r=>`<div class="staffrow"><button class="chk${rolesOf(a).includes(r)?' done':''}" style="flex:1" onclick="toggleRole('${r}')"><span class="box"></span><span class="txt">${r}</span></button></div>`).join('')}</div>
    <div class="sys" style="margin-top:14px">Пароль</div><input class="naryad" placeholder="новый пароль" value="${(a.pass||'').replace(/"/g,'&quot;')}" oninput="updUser('pass',this.value)">
    <button class="save-btn" style="margin-top:16px" onclick="location.hash='profile-users'">Сохранить</button>
    ${a.id!=='admin'?`<button class="save-btn" style="background:#8c0808;margin-top:12px" onclick="delUser('${a.id}')">Удалить аккаунт</button>`:''}
    <div class="foot">Логин привязывается к имени сотрудника. По этому логину человек входит и получает задачи и уведомления.</div>
  </div>`;
}
function updUser(f, v){ const a=ACCOUNTS.find(x=>x.id===state.editId); if(!a) return; a[f]=v;
  if(a.id===PROFILE.id){ PROFILE=a; try{localStorage.setItem('previewProfile',JSON.stringify(a));}catch(e){} }
  saveAccounts(); }
function toggleRole(r){ const a=ACCOUNTS.find(x=>x.id===state.editId); if(!a) return;
  if(!Array.isArray(a.roles)) a.roles = a.role?[a.role]:[];
  const i=a.roles.indexOf(r);
  if(i>=0) a.roles.splice(i,1); else { if(a.roles.length>=2){ toast('Максимум 2 роли'); return; } a.roles.push(r); }
  if(!a.roles.length) a.roles=['Сотрудник'];
  if(a.id===PROFILE.id){ PROFILE=a; try{localStorage.setItem('previewProfile',JSON.stringify(a));}catch(e){} }
  saveAccounts(); renderEditUser(); }
function delUser(id){ ACCOUNTS=ACCOUNTS.filter(x=>x.id!==id); saveAccounts(); if(PROFILE.id===id) resolveProfile(); location.hash='profile-users'; toast('Аккаунт удалён'); }

let tt;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2200);
}
function route(keep){
  const h = location.hash.slice(1);
  renderTabbar();
  if(h==='tasks'){ renderTasks(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='newtask'){ if(!newTask) newTask={system:'АПС',object:'',assignees:[]}; renderNewTask(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile'){ renderProfile(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile-users'){ renderUsers(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile-user'){ renderEditUser(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='pctv'){ renderPctv(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='pctv-inst'){ renderPctvInst(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='objedit' && state.oeKey){ renderObjEdit(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='grpedit' && state.geName){ renderGrpEdit(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='zsub' && state.zs && state.day) renderZSub();
  else if(h==='zsec' && state.zs && state.day && state.secObj) renderSectors();
  else if(h==='zgroup' && state.zs && state.day && state.grpId) renderGroup();
  else if(h==='sub' && state.sub && state.day) renderSub();
  else if(h==='menu' && state.day && state.mode) renderMenu();
  else if(h==='nar' && state.day) renderNar();
  else if(h==='plan' && state.day) renderPlan();
  else if(h==='notif') renderNotif();
  else if(h==='item' && state.day && state.itemKey && state.mode) renderItem();
  else if(h==='week' && state.weekStart!==null) renderWeek();
  else if(h==='month') renderMonth();
  else renderYear();
  if(!keep) window.scrollTo(0,0);
}
// Одноразовый сброс данных ежедневника/задач (ростер и роли сохраняются)
async function wipeDiaryData(){
  const dates=new Set();
  try{ for(let i=0;i<localStorage.length;i++){ const kk=localStorage.key(i); const m=kk&&kk.match(/^(?:chk|meta)-(.+)$/); if(m) dates.add(m[1]); } }catch(e){}
  try{ const rm=[]; for(let i=0;i<localStorage.length;i++){ const kk=localStorage.key(i); if(/^(chk|meta)-/.test(kk)||kk==='tasks') rm.push(kk); } rm.forEach(kk=>localStorage.removeItem(kk)); }catch(e){}
  await dbReady;
  if(DB){ for(const d of dates){ try{ await DB.collection('data/users/'+UID).doc('day-'+d).set({done:[]}); }catch(e){} try{ await DB.collection('data/users/'+UID).doc('meta-'+d).set({items:{}}); }catch(e){} }
    try{ await DB.collection('data/users/'+UID).doc('tasks').set({list:[], gen:(typeof TASK_GEN!=='undefined'?TASK_GEN:'1')}); }catch(e){} }
  try{ for(const k in CHECKS) delete CHECKS[k]; }catch(e){}
  try{ for(const k in META) delete META[k]; }catch(e){}
  try{ if(Array.isArray(TASKS)) TASKS.length=0; }catch(e){}
}
async function resetDiaryData(){ if(!confirm('Удалить ВСЕ данные ежедневника и задач? Отметки, наряды, исполнители и задачи будут стёрты. Сотрудники и роли останутся.')) return; await wipeDiaryData(); toast('Данные сброшены'); try{ location.hash=''; }catch(e){} setTimeout(()=>{ try{ location.reload(); }catch(e){ route(true); } }, 400); }
(async()=>{ try{ if(localStorage.getItem('wipe_2026_11')!=='1'){ localStorage.setItem('wipe_2026_11','1'); await wipeDiaryData(); try{ location.reload(); }catch(e){ route(true); } } }catch(e){} })();
window.addEventListener('hashchange', route);
if(location.hash && location.hash!=='#') { try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
if((!location.hash || location.hash==='#') && isEmployeeOnly()){ try{ location.hash='tasks'; }catch(e){} }
route();
(function(){ const a=document.getElementById('app'); let sx=0,sy=0;
  a.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  a.addEventListener('touchend',e=>{ const h=location.hash.slice(1);
    if(!(h===''||h==='tasks'||h==='profile')) return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8){ const o=tabOrder(); let i=o.indexOf(curTab());
      if(dx<0&&i<o.length-1) goTab(o[i+1]); else if(dx>0&&i>0) goTab(o[i-1]); } },{passive:true});
})();
setTimeout(()=>{ const sp = document.getElementById('splash'); if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(), 600); } }, 1800);
</script>
