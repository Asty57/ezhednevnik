<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c00d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f5ef; --card:#ffffff; --ink:#1b1b1b; --muted:#7a726a;
    --line:#ece3d3; --accent:#c00d0d; --accent-soft:#fdefcc; --red:#e09200; --navy:#1b1b1b;
    --gold:#f9b000; --grad1:#d01414; --grad2:#8c0808;
    --shadow:0 2px 10px rgba(60,20,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  .app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:10px;margin:6px 0 18px;min-height:44px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px;color:var(--navy);letter-spacing:-.2px;margin:0;flex:1;line-height:1.15}
  .sub{color:var(--muted);font-size:14px;margin-top:2px;font-family:'Inter',sans-serif;font-weight:600}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);
    font-size:22px;color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
  .icon-btn:active{transform:scale(.95)}
  button{font-family:inherit}

  /* Page 1: months */
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .month{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px 10px;cursor:pointer;
    box-shadow:var(--shadow);text-align:center;color:var(--ink)}
  .month:active{transform:scale(.97)}
  .month .name{font-family:'Montserrat',sans-serif;font-weight:600;font-size:16px;margin-bottom:6px}
  .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:8.5px;color:var(--muted);line-height:1.6}
  .mini span.t{background:var(--accent);color:#fff;border-radius:50%}
  .month.current{border-color:var(--accent);background:linear-gradient(#ffffff,#fff4d9)}
  .month.current .name{color:var(--accent)}
  .today-btn{margin:18px auto 0;display:block;background:var(--accent);color:#fff;border:0;border-radius:14px;
    padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}

  /* Page 2: weeks */
  .wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--muted);
    padding:0 12px 8px}
  .wd span:nth-child(n+6){color:var(--red)}
  .weeks{display:flex;flex-direction:column;gap:10px}
  .week{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px 12px;
    cursor:pointer;box-shadow:var(--shadow);color:var(--ink);text-align:left}
  .week:active{transform:scale(.985)}
  .week .label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .week .label b{color:var(--accent)}
  .week .days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:17px;font-weight:600}
  .week .days span{padding:4px 0;border-radius:10px}
  .week .days span.out{color:#c3ccd8}
  .week .days span.t{background:var(--accent);color:#fff}
  .week.current{border-color:var(--accent)}

  /* Page 3: days */
  .daylist{display:flex;flex-direction:column;gap:10px}
  .day{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);text-align:left}
  .day:active{transform:scale(.985)}
  .day .num{width:50px;height:50px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--accent);flex:none}
  .day .info{flex:1}
  .day .dn{font-weight:700;font-size:17px}
  .day .dm{font-size:13px;color:var(--muted);margin-top:2px}
  .day .arrow{color:var(--muted);font-size:20px}
  .day.weekend .dn{color:var(--red)}
  .day.today{border-color:var(--accent)}
  .day.today .num{background:var(--accent);color:#fff}
  .tag{font-size:11px;font-weight:700;background:var(--gold);color:#1b1b1b !important;color:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:2px}

  /* Plan pages */
  .menu{display:flex;flex-direction:column;gap:12px}
  .mbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);text-align:left;font-size:18px;font-weight:700}
  .mbtn:active{transform:scale(.985)}
  .mbtn .ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex:none}
  .mbtn .t{flex:1}
  .mbtn .s{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
  .mbtn .arrow{color:var(--muted);font-size:20px}
  .sys{margin:4px 2px 10px;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .grp.now{border-color:var(--accent);border-width:2px}
  .grp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .grp h3 small{font-weight:700;font-size:11px;background:var(--accent);color:#fff;border-radius:8px;padding:3px 8px;white-space:nowrap}
  .grp ul{margin:0;padding-left:18px;line-height:1.55;font-size:15px}
  .grp .note{font-size:13px;color:var(--muted);margin:2px 0 6px}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .pills span{font-size:11px;font-weight:700;padding:3px 6px;border-radius:7px;background:#e9eef5;color:#9aa6b6}
  .pills span.on{background:var(--accent-soft);color:var(--accent)}
  .pills span.cur{background:var(--accent);color:#fff}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);line-height:1.5}
  .seg{display:flex;background:#e1e8f1;border-radius:14px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .foot{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}

  .chk{display:flex;align-items:stretch;gap:0;width:100%;background:none;border:0;border-top:1px solid #edf1f6;padding:0;line-height:1.4;color:var(--ink);font-family:inherit}
  .chk:first-of-type{border-top:0}
  .cbox{background:none;border:0;padding:11px 8px 11px 2px;cursor:pointer;flex:none;display:flex;align-items:flex-start}
  .cbody{flex:1;background:none;border:0;text-align:left;padding:11px 2px;cursor:pointer;display:flex;align-items:flex-start;gap:8px;color:var(--ink);font-size:15px;font-family:inherit;line-height:1.4}
  .cbody .txt{flex:1}
  .chv{color:#c3ccd8;font-size:18px;align-self:center;flex:none}
  .chk .box{width:24px;height:24px;border-radius:8px;border:2px solid #b9c5d6;flex:none;display:grid;place-items:center;transition:.15s;margin-top:-1px}
  .chk.done .box{background:#3f9a5c;border-color:#3f9a5c}
  .chk.done .box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .chk.done .txt{color:var(--muted);text-decoration:line-through}
  .chk.pick .txt{text-decoration:none!important;color:var(--ink)}
  .chk.pick.on{background:#eafbf0;border-radius:10px}
  .chk.pick.on .box{background:#3f9a5c;border-color:#3f9a5c}
  .chk.pick.on .box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .chk.pick.on .txt{font-weight:700}
  .nonar{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;color:var(--ink);cursor:pointer}
  .nonar input{width:20px;height:20px;accent-color:var(--accent)}
  .grp h3 small.cnt{background:#e9eef5;color:var(--muted)}
  .grp h3 small.cnt.full{background:#3f9a5c;color:#fff}
  .export-btn{display:block;width:100%;margin-top:18px;background:var(--card);border:1.5px dashed var(--accent);color:var(--accent);
    border-radius:16px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
  .report-banner{display:block;width:100%;text-align:left;background:var(--accent);color:#fff;border:0;border-radius:18px;padding:14px 16px;
    margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow);font-size:16px}
  .report-banner span{display:block;font-size:13px;opacity:.9;margin-top:3px}
  .summ{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .sl{font-size:12.5px;line-height:1.35;background:#faf4e8;border-radius:10px;padding:6px 9px}
  .sl b{display:block;font-size:12px;color:var(--ink)}
  .sl span{color:var(--muted)}
  .sl span u{color:var(--ink);font-weight:700;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
  .day{align-items:flex-start}
  .day .arrow{align-self:center}
  .chk small{display:inline-block;width:100%;font-size:11.5px;color:var(--accent);margin-top:2px;text-decoration:none}
  .chk small.regdone{color:#2f8a4e;font-weight:700}
  .bigdone{display:block;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
  .bigdone.on{background:#2f8a4e;border-color:#2f8a4e;color:#fff}
  .naryad{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);margin-top:4px}
  .chk small.camloc{color:var(--muted);font-weight:600}
  .chk small.metahint{color:#2f8a4e;font-weight:600}
  .grp .objhead{font-weight:700;font-size:13px;color:var(--accent);margin:10px 0 2px;padding-top:8px;border-top:1px solid #edf1f6}
  .grp .objhead:first-of-type{border-top:0;padding-top:2px;margin-top:0}
  .grp .objhead + .chk{border-top:0}
  .chk.locked{opacity:.75}
  .chk.locked .box{background:#9bb8a4;border-color:#9bb8a4}
  .chk.done .txt small{text-decoration:none}
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 42%,#ffffff 0%,#fbf6ec 60%,#f3e8d2 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s ease, visibility .5s}
  #splash.hide{opacity:0;visibility:hidden}
  #splash .stage{perspective:900px;width:280px;height:160px;display:grid;place-items:center}
  #splash .spin{animation:spin 2s cubic-bezier(.45,.05,.3,1) infinite;transform-style:preserve-3d;display:grid;place-items:center}
  #splash .spin img{max-width:260px;max-height:140px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(120,40,0,.18))}
  #splash .spin .ph{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold) 0 50%,var(--accent) 50% 100%);
    box-shadow:0 10px 24px rgba(120,40,0,.25)}
  @keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
  #splash .bar{width:150px;height:4px;border-radius:4px;background:rgba(192,13,13,.12);overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:4px;animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .brand{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(135deg,var(--grad1),var(--grad2));
    border-bottom:4px solid var(--gold);border-radius:20px;padding:18px 12px 14px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.15);color:#fff}
  .blogo{height:76px;min-width:76px;max-width:240px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:8px 14px}
  .blogo img{max-width:100%;max-height:60px;object-fit:contain}
  .blogo.icon{font-size:34px}
  .btxt{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;letter-spacing:.5px}
  .gear{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);font-size:19px;cursor:pointer}
  .wk-export{margin-top:16px}
  .wk-export button{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;
    background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;box-shadow:var(--shadow)}
  .wk-export .prog{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
  .wk-export .prog b{color:var(--ink)}
  .wk-export .bar2{height:6px;border-radius:4px;background:var(--accent-soft);margin-top:8px;overflow:hidden}
  .wk-export .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:4px}
  .wk-export .small{display:block;text-align:center;margin-top:8px;font-size:13px;color:var(--accent);background:none;box-shadow:none;padding:6px;font-weight:600}
  #splash .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
  #splash .face.b{transform:rotateY(180deg)}
  #bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
  #bgLayer::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:var(--veil,.82)}
  body.has-bg{background:transparent}
  html{background:var(--bg)}
  body.has-bg .month,body.has-bg .week,body.has-bg .day,body.has-bg .mbtn,body.has-bg .grp{background:rgba(255,255,255,.9);backdrop-filter:blur(2px)}
  .range{width:100%;accent-color:var(--accent)}
  #splash .sptitle{font-family:'Montserrat',sans-serif;font-weight:800;font-size:30px;color:#1b1b1b;letter-spacing:.5px;margin-top:-14px}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
  .bell{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
  .bell.on{background:var(--accent);border-color:var(--accent)}
  .switch{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px;font-weight:700;font-size:15px}
  .switch span:first-child{flex:1}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{width:48px;height:28px;border-radius:16px;background:#cdd5e0;position:relative;transition:.2s;flex:none}
  .switch .track::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::after{transform:translateX(20px)}
  .timeinput{font-size:28px;font-family:'Montserrat',sans-serif;font-weight:700;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:8px;color:var(--ink);background:var(--bg)}
  .staffrow{display:flex;align-items:center;gap:4px;border-top:1px solid #edf1f6}
  .staffrow:first-child{border-top:0}
  .staffrow .chk .txt{font-weight:700}
  .staffrow .chk{cursor:pointer}
  .delstaff{width:38px;height:38px;border:0;background:none;color:#c3ccd8;font-size:16px;cursor:pointer;flex:none}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--card)}
  .addrow button{width:52px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;font-size:24px;cursor:pointer}
  .save-btn{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;box-shadow:var(--shadow)}
  .app{padding-bottom:88px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  .tabbtn{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
  .tabbtn.on{color:var(--accent)}
  .tabbtn .ti{font-size:22px;position:relative;line-height:1}
  .tabbtn .badge{position:absolute;top:-5px;right:-11px;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px;font-style:normal}
  .tabhead{margin:4px 2px 14px}
  .tabhead h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;color:var(--navy);margin:0}
  .tabhead .sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
  .taskcard .tasktitle{font-weight:800;font-size:16px;margin-bottom:8px}
  .taskmeta{font-size:14px;color:var(--ink);margin:3px 0;line-height:1.4}
  .resp{margin-top:10px;border-top:1px solid #edf1f6;padding-top:8px}
  .resphead{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .respline{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0}
  .st{font-weight:700;border-radius:8px;padding:3px 9px;font-size:12px}
  .st-new{background:#e9eef5;color:#8a93a0}
  .st-prog{background:#fdefcc;color:#9a6a00}
  .st-done{background:#ddf2e3;color:#2f8a4e}
  .taskseg{margin-top:12px}
  .taskrow{display:flex;align-items:stretch;gap:10px}
  .taskinfo{flex:1;min-width:0}
  .taskacts{display:flex;flex-direction:column;gap:12px;flex:none;align-items:center;justify-content:space-between}
  .emojiwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
  .emojiwrap .cap{font-size:10px;font-weight:700;color:var(--muted)}
  .objrow{display:flex;gap:8px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;border:1px solid #cdd7f5;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
  .chip button{border:0;background:#c00d0d;color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer}
  .emoji{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#f3f5f9;font-size:22px;cursor:pointer;opacity:.5;transition:.15s}
  .emoji.on{opacity:1}
  .emoji.on.done{background:#ddf2e3;border-color:#2f8a4e}
  .emoji.on.prog{background:#fdefcc;border-color:#e0a000}
  .closedtag{margin-top:10px;color:#2f8a4e;font-weight:700;font-size:14px}
  .taskcard.closed{opacity:.8}
  .taskbtns{display:flex;gap:8px;margin-top:10px}
  .tbtn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
  .tbtn.del{color:#c00d0d;border-color:#f0c9c9}
  .respline button.st{border:1px dashed #c9d2de;cursor:pointer;font-family:inherit}

<body>
<div id="splash" aria-hidden="true">
  <div class="stage"><div class="spin" id="spLogo"><div class="ph"></div></div></div>
  <div class="sptitle">Ежедневник</div>
  <div class="bar"><i></i></div>
</div>
<div id="bgLayer"></div>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script>
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];

const today = new Date(); today.setHours(0,0,0,0);
const state = { year: today.getFullYear(), month: today.getMonth(), weekStart: null, day: null, sub: null, mode: null, allYear: false };
const app = document.getElementById('app');

const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };

function weeksOfMonth(y,m){
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const res = [];
  for(let s = mondayOf(first); s <= last; s = addDays(s,7)) res.push(s);
  return res;
}
function rangeText(s){
  const e = addDays(s,6);
  if(s.getMonth()===e.getMonth()) return `${s.getDate()}–${e.getDate()} ${MONTHS_GEN[e.getMonth()]}`;
  return `${s.getDate()} ${MONTHS_GEN[s.getMonth()]} – ${e.getDate()} ${MONTHS_GEN[e.getMonth()]}`;
}

/* ---------- Страница 1: календарь (месяцы) ---------- */
function renderYear(){
  let html = `<div class="view">
    <div class="topbar">${isEmployeeOnly() ? '' : `<button class="bell${NOTIF.on?' on':''}" onclick="openNotif()" aria-label="Уведомления">🔔</button>`}</div>
    <header>
      <button class="icon-btn" onclick="changeYear(-1)" aria-label="Предыдущий год">‹</button>
      <h1 style="text-align:center">${state.year}<div class="sub">Сегодня: ${today.getDate()} ${MONTHS_GEN[today.getMonth()]} ${today.getFullYear()}</div></h1>
      <button class="icon-btn" onclick="changeYear(1)" aria-label="Следующий год">›</button>
    </header>
    <div class="months">`;
  for(let m=0;m<12;m++){
    const cur = state.year===today.getFullYear() && m===today.getMonth();
    let mini = WD_SHORT.map(w=>`<span>${w[0]}</span>`).join('');
    const offset = (new Date(state.year,m,1).getDay()+6)%7;
    const days = new Date(state.year,m+1,0).getDate();
    for(let i=0;i<offset;i++) mini += '<span></span>';
    for(let d=1; d<=days; d++){
      const t = same(new Date(state.year,m,d), today);
      mini += `<span${t?' class="t"':''}>${d}</span>`;
    }
    html += `<button class="month${cur?' current':''}" onclick="openMonth(${m})">
      <div class="name">${MONTHS[m]}</div><div class="mini">${mini}</div></button>`;
  }
  html += `</div>`;
  if(today.getDate()<=7){
    const pm = new Date(today.getFullYear(), today.getMonth()-1, 1);
    html = html.replace('<div class="months">', `<button class="report-banner" onclick="exportMonth(${pm.getFullYear()},${pm.getMonth()})"><b>📊 ${MONTHS[pm.getMonth()]} закончился</b><span>Скачайте отчёт со всеми галочками в Excel</span></button><div class="months">`);
  }
  if(state.year!==today.getFullYear()) html += `<button class="today-btn" onclick="goToday()">Вернуться к ${today.getFullYear()} году</button>`;
  html += `</div>`;
  app.innerHTML = html;
}

/* ---------- Страница 2: недели месяца ---------- */
function renderMonth(){
  const {year:y, month:m} = state;
  let html = `<div class="view">
    <header>
      <button class="icon-btn" onclick="history.back()" aria-label="Назад">←</button>
      <h1>${MONTHS[m]}<div class="sub">${y} · выберите неделю</div></h1>
    </header>
    <div class="wd">${WD_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="weeks">`;
  weeksOfMonth(y,m).forEach((s,i)=>{
    let cells = '', isCur = false;
    for(let k=0;k<7;k++){
      const d = addDays(s,k);
      const t = same(d,today); if(t) isCur = true;
      const cls = [d.getMonth()!==m?'out':'', t?'t':''].join(' ').trim();
      cells += `<span${cls?` class="${cls}"`:''}>${d.getDate()}</span>`;
    }
    html += `<button class="week${isCur?' current':''}" onclick="openWeek(${s.getTime()})">
      <div class="label"><span>Неделя ${i+1}${isCur?' · <b>текущая</b>':''}</span><span>${rangeText(s)}</span></div>
      <div class="days">${cells}</div></button>`;
  });
  html += `</div><button class="export-btn" onclick="exportMonth(${y},${m})">📊 Скачать отчёт за ${MONTHS[m].toLowerCase()} (Excel)</button></div>`;
  app.innerHTML = html;
}

/* ---------- Страница 3: дни недели ---------- */
function renderWeek(){
  const s = new Date(state.weekStart);
  let html = `<div class="view">
    <header>
      <button class="icon-btn" onclick="history.back()" aria-label="Назад">←</button>
      <h1>${rangeText(s)}<div class="sub">${addDays(s,6).getFullYear()} · выберите день</div></h1>
    </header>
    <div class="daylist">`;
  for(let k=0;k<7;k++){
    const d = addDays(s,k), t = same(d,today);
    html += `<button class="day${k>=5?' weekend':''}${t?' today':''}" onclick="openDay(${d.getTime()})">
      <div class="num">${d.getDate()}</div>
      <div class="info"><div class="dn">${WD_FULL[k]}${t?'<span class="tag">сегодня</span>':''}</div>
      <div class="dm">${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</div>
      ${daySummary(d)}</div>
      <div class="arrow">›</div></button>`;
  }
  html += `</div>`;
  let filled = 0;
  for(let k=0;k<5;k++){ const d = addDays(s,k); if(checkSet(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())).size) filled++; }
  html += `<div class="wk-export">` + (filled===5
    ? `<button onclick="exportWeek(${s.getTime()})">✅ Неделя заполнена — скачать Excel</button>`
    : `<div class="prog">Заполнено <b>${filled} из 5</b> рабочих дней. Когда заполните все, появится кнопка скачивания отчёта.<div class="bar2"><i style="width:${filled*20}%"></i></div></div>
       ${filled?`<button class="small" onclick="exportWeek(${s.getTime()})">Всё равно скачать Excel за неделю</button>`:''}`) + `</div></div>`;
  app.innerHTML = html;
}


/* Краткая сводка дня на странице недели */
function daySummary(d){
  const k = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  const set = checkSet(k);
  if(!set.size) return '';
  const groups = [
    {name:'Регламент', icon:'📋', pre:['reg']},
    {name:'Заявки', icon:'📝', pre:['zay']},
    {name:'Запланированные', icon:'📌', pre:['pn','on']}
  ];
  let out = '';
  groups.forEach(g=>{
    const items = [...set].filter(x=>g.pre.includes(x.split('|')[0]));
    if(!items.length) return;
    const bySys = {};
    items.forEach(x=>{ const p = x.split('|'); const sys = p[1]==='video' ? 'Видео' : (REG[p[1]] ? REG[p[1]].title : p[1]);
      (bySys[sys] = bySys[sys] || []).push(p[p.length-1].replace('Камера № ','кам. ')); });
    const shown = Object.entries(bySys).map(([sys,list])=>`<u>${sys}</u>: ${list.slice(0,3).join(', ')}${list.length>3?` и ещё ${list.length-3}`:''}`).join('<br>');
    const objs = items;
    out += `<div class="sl"><b>${g.icon} ${g.name} · ${objs.length}</b><span>${shown}</span></div>`;
  });
  return `<div class="summ">${out}</div>`;
}

/* ---------- Навигация ---------- */
function changeYear(n){ state.year += n; renderYear(); }

const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  for(const [name, text] of files){
    const nb = enc.encode(name), db = enc.encode(text), crc = crc32(db);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,db.length,true); h.setUint32(22,db.length,true); h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer), nb, db);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,db.length,true); c.setUint32(24,db.length,true); c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + db.length;
  }
  const cenLen = cen.reduce((s,a)=>s+a.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cenLen,true); e.setUint32(16,off,true);
  const all = [...parts, ...cen, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((s,a)=>s+a.length,0)); let p = 0;
  all.forEach(a=>{ out.set(a,p); p += a.length; });
  return out;
}
const xesc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(i){ let s=''; i++; while(i){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
/* rows: массив строк; ячейка = значение или {v, s} (s — номер стиля) */
function sheetXml(rows, widths, freeze){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(freeze) x += `<sheetViews><sheetView workbookViewId="0"><pane xSplit="${freeze[0]}" ySplit="${freeze[1]}" topLeftCell="${colName(freeze[0])}${freeze[1]+1}" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>`;
  x += '<cols>' + widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  rows.forEach((row,ri)=>{
    x += `<row r="${ri+1}">`;
    row.forEach((cell,ci)=>{
      if(cell===null || cell===undefined || cell==='') return;
      const o = typeof cell === 'object' ? cell : {v:cell};
      const ref = colName(ci)+(ri+1), st = o.s ? ` s="${o.s}"` : '';
      if(typeof o.v === 'number') x += `<c r="${ref}"${st}><v>${o.v}</v></c>`;
      else if(o.v==='' ) x += `<c r="${ref}"${st}/>`;
      else x += `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xesc(o.v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function buildXlsx(sheets){

   + '<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
   + '<fill><patternFill patternType="solid"><fgColor rgb="FFF3DCCF"/></patternFill></fill>'
   + '<fill><patternFill patternType="solid"><fgColor rgb="FFDDF2E3"/></patternFill></fill>'
   + '<fill><patternFill patternType="solid"><fgColor rgb="FFEDEDED"/></patternFill></fill></fills>'
   + '<borders count="2"><border/><border><left style="thin"><color rgb="FFCCCCCC"/></left><right style="thin"><color rgb="FFCCCCCC"/></right><top style="thin"><color rgb="FFCCCCCC"/></top><bottom style="thin"><color rgb="FFCCCCCC"/></bottom></border></borders>'
   + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">'
   + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
   + '<xf numFmtId="0" xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
   + '<xf numFmtId="0" xfId="0" fontId="2" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>'
   + '<xf numFmtId="0" xfId="0" fontId="0" fillId="0" borderId="1" applyBorder="1"/>'
   + '<xf numFmtId="0" xfId="0" fontId="0" fillId="4" borderId="1" applyFill="1" applyBorder="1"/>'
   + '<xf numFmtId="0" xfId="0" fontId="1" fillId="0" borderId="0" applyFont="1"/>'
   + '<xf numFmtId="0" xfId="0" fontId="0" fillId="0" borderId="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'
   + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const files = [
    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
      + `<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', styles],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`, sheetXml(s.rows, s.widths, s.freeze)])
  ];
  return zip(files);
}

async function loadDayMeta(dates){
  await dbReady;
  return Promise.all(dates.map(async dt=>{
    const k = `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
    if(META[k]) return META[k];
    let o=null;
    if(DB){ try{ const snap = await DB.collection('data/users/'+UID).doc('meta-'+k).get();
      const data = snap && typeof snap.data==='function'?snap.data():snap;
      if(data && data.items) o=data.items; }catch(e){} }
    if(!o){ try{ o=JSON.parse(localStorage.getItem('meta-'+k)||'{}'); }catch(e){ o={}; } }
    META[k]=o; return o;
  }));
}
async function loadDayChecks(dates){
  await dbReady;
  return Promise.all(dates.map(async dt=>{
    const k = `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
    if(CHECKS[k]) return new Set(CHECKS[k]);
    let arr = null;
    if(DB){ try{
      const snap = await DB.collection('data/users/'+UID).doc('day-'+k).get();
      const data = snap && typeof snap.data === 'function' ? snap.data() : snap;
      if(data && Array.isArray(data.done)) arr = data.done;
    }catch(e){} }
    if(!arr){ try{ arr = JSON.parse(localStorage.getItem('chk-'+k) || '[]'); }catch(e){ arr = []; } }
    CHECKS[k] = new Set(arr);
    return new Set(arr);
  }));
}
/* Отчёт за любой период: dates — массив дат, title — «за ноябрь 2026 г.» */
async function makeReportRange(dates, title){
  const checks = await loadDayChecks(dates);
  const dayMeta = await loadDayMeta(dates);
  const wd = dt => (dt.getDay()+6)%7;
  const multiMonth = dates[0].getMonth()!==dates[dates.length-1].getMonth() || dates.length<28;
  const head = ['Раздел','Система','Подраздел','Объект',
    ...dates.map(dt=> multiMonth ? `${pad2(dt.getDate())}.${pad2(dt.getMonth()+1)}\n${WD_SHORT[wd(dt)]}` : `${dt.getDate()}\n${WD_SHORT[wd(dt)]}`), 'Всего'].map(v=>({v, s:1}));
  const objs = [];
  [...new Set(dates.map(dt=>dt.getMonth()))].forEach(m=>monthObjects(m).forEach(k=>{ if(!objs.includes(k)) objs.push(k); }));
  checks.forEach(set=>set.forEach(k=>{ if(!objs.includes(k)) objs.push(k); }));
  const rows = [[{v:`Отчёт ${title} — отметки по дням`, s:5}], head];
  let total = 0;
  objs.forEach(k=>{
    const o = parseKey(k); let n = 0;
    const cells = dates.map((dt,i)=>{ if(checks[i].has(k)){ n++; return {v:'✓', s:2}; } return {v:'', s: wd(dt)>=5 ? 4 : 3}; });
    total += n;
    rows.push([{v:o.razdel,s:3},{v:o.sys,s:3},{v:o.sub,s:3},{v:o.obj,s:3}, ...cells, {v:n, s:3}]);
  });
  const JHEAD = ['№ П/П','Дата','Наименование объекта','Система (АПС/СКУД/CCTV/АОС)','Выполненные работы (описать подробно)','Наряд (указать какой)','ФИО исполнителя работ','Время начала работ','Время завершения работ','Роспись сотрудника RichFit','Примечание'];
  const SYS_SHORT = {'Видеонаблюдение':'CCTV'};
  const ORD = {reg:0, zay:1, zp:2, pn:3, on:4};
  const camName = o => { const mm = o.obj.match(/^Камера № (\d+)$/); return (mm && CAM_LABELS[+mm[1]]) ? `${o.obj} (${CAM_LABELS[+mm[1]]})` : o.obj; };
  const log = [ JHEAD.map(v=>({v,s:1})) ];
  dates.forEach((dt,i)=>{
    const keys = [...checks[i]].sort((a,b)=> (ORD[a.split('|')[0]]-ORD[b.split('|')[0]]) || a.localeCompare(b));
    let n = 0;
    keys.forEach(k=>{
      const o = parseKey(k); n++;
      const dateStr = `${pad2(dt.getDate())}.${pad2(dt.getMonth()+1)}.${dt.getFullYear()}`;
      const sysName = SYS_SHORT[o.sys] || o.sys;
      const work = o.razdel==='Регламент' ? 'ТО' : '';
      const rec = (dayMeta[i] && dayMeta[i][k]) || {};
      const fio = (rec.w || []).join('\n');
      const nar = rec.n || '';
      let tbeg = rec.from ? fmtDate(rec.from) : '';
      let tend = rec.to ? fmtDate(rec.to) : '';
      let prim = rec.note || '';
      // совместимость со старыми записями: срок/продление лежали в «Примечании»
      if(!tbeg && !tend){
        const ms = prim.match(/Срок:\s*([\d.]+)?\s*—\s*([\d.]+)?/);
        if(ms){ tbeg = ms[1]||''; tend = ms[2]||''; }
      }
      const mx = prim.match(/продлено до\s*([\d.]+)/);
      if(mx && mx[1]) tend = mx[1];
      prim = prim.replace(/Срок:[^;]*/g,'').replace(/продлено до[^;]*/g,'').replace(/[;\s]+$/,'').replace(/^[;\s]+/,'').trim();
      log.push([ {v:n,s:3}, {v:dateStr,s:3}, {v:camName(o),s:6}, {v:sysName,s:3},
        {v:work,s:3}, {v:nar,s:3},{v:fio,s:6},{v:tbeg,s:3},{v:tend,s:3},{v:'',s:3},{v:prim,s:6} ]);
    });
  });
  if(log.length===1) log.push([{v:'За этот период отметок нет'}]);
  return { bytes: buildXlsx([
    { name:'Журнал', rows:log, widths:[6,12,38,16,30,14,24,12,14,20,16], freeze:[0,1] }
  ]), total };
}
async function saveReport(dates, title, filename){
  await dlReady;
  if(!DL){ toast('Скачивание недоступно здесь. Откройте дневник в приложении Claude или на claude.ai'); return; }
  toast('Готовлю отчёт…');
  try{
    const r = await makeReportRange(dates, title);
    await DL.save({ filename, data:r.bytes });
    toast('Отчёт сохранён');
  }catch(e){
    const c = e && e.code;
    if(c==='declined') return;
    toast(c==='rate_limited' ? 'Подождите и попробуйте ещё раз' : 'Не удалось сохранить отчёт');
  }
}
function exportMonth(y,m){

}
function exportWeek(ts){

}

/* ---------- Логотип компании (добавляет сам пользователь) и цвета ---------- */
let LOGO = 'logo.png';
try{ LOGO = localStorage.getItem('logo') || 'logo.png'; }catch(e){}
function hexToRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
function applyTheme(accent){
  const r = document.documentElement.style;
  if(!accent){ ['--accent','--accent-soft','--navy','--bg','--line','--grad1','--grad2'].forEach(v=>r.removeProperty(v)); return; }
  r.setProperty('--accent', accent);
  r.setProperty('--accent-soft', mix(accent,'#ffffff',.86));
  r.setProperty('--navy', mix(accent,'#000000',.55));
  r.setProperty('--bg', mix(accent,'#ffffff',.94));
  r.setProperty('--line', mix(accent,'#ffffff',.82));
  r.setProperty('--grad1', accent);
  r.setProperty('--grad2', mix(accent,'#000000',.45));
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = mix(accent,'#000000',.45);
}
/* Главный цвет логотипа: самый частый насыщенный оттенок */
function logoColor(img){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.drawImage(img,0,0,64,64);
  const d = x.getImageData(0,0,64,64).data, buckets = {}; let dark = null, darkL = 999;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128) continue;
    const r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, sat = mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));
    if(l<darkL && l>20){ darkL=l; dark=[r,g,b]; }
    if(sat<.3 || l<35 || l>225) continue;
    const k = [r>>4,g>>4,b>>4].join(',');
    (buckets[k] = buckets[k] || {n:0,r:0,g:0,b:0}); buckets[k].n++; buckets[k].r+=r; buckets[k].g+=g; buckets[k].b+=b;
  }
  const best = Object.values(buckets).sort((a,b)=>b.n-a.n)[0];
  let col = best && best.n>8 ? rgbToHex(best.r/best.n,best.g/best.n,best.b/best.n) : (dark ? rgbToHex(...dark) : null);
  if(col){ const [r,g,b] = hexToRgb(col); const l = (Math.max(r,g,b)+Math.min(r,g,b))/2; if(l>150) col = mix(col,'#000000',.35); }
  return col;
}
function pickLogo(input){
  const f = input.files && input.files[0]; input.value = ''; if(!f) return;
  if(f.type && !f.type.startsWith('image/') && !/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(f.name)){ toast('Это не картинка. Выберите PNG, JPG или SVG'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 256/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ LOGO = c.toDataURL('image/png'); }catch(e){ toast('Не удалось прочитать картинку'); return; }
      const col = logoColor(img);
      try{ localStorage.setItem('logo', LOGO); localStorage.setItem('accent', col||''); }catch(e){}
      saveSettings({logo:LOGO, accent:''});
      renderSettings(); toast('Логотип добавлен');
    };
    img.onerror = () => toast('Не удалось открыть картинку. Попробуйте PNG или JPG');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function removeLogo(){

  saveSettings({logo:'', accent:''}); renderSettings();
}

function taskTitle(t){ return (t.kind==='zay') ? '📝 Заявка' : '📋 Провести регламент'; }
function taskObjs(t){ return (t.objects&&t.objects.length)?t.objects:(t.object?[t.object]:[]); }
function objLine(t){ const o=taskObjs(t); return `<div class="taskmeta">Объект${o.length>1?'ы ('+o.length+')':''}: <b>${o.join(', ')||'—'}</b></div>`; }
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3 ? `${p[2]}.${p[1]}.${p[0]}` : iso; }
function taskNote(t){ let a=[]; if(t.from||t.to) a.push('Срок: '+(t.from?fmtDate(t.from):'…')+' — '+(t.to?fmtDate(t.to):'…')); if(t.extendedTo) a.push('продлено до '+fmtDate(t.extendedTo)); return a.join('; '); }
function taskCard(t){
  if(t.source==='diary'){
    const resp=(t.assignees||[]).map(a=>`<div class="respline"><span>${a.name}</span><span class="st st-done">Выполнено</span></div>`).join('');
    return `<div class="grp taskcard"><div class="diarytag">🗓 Из ежедневника · ${t.day?t.day.split('-').reverse().join('.'):''}</div>
      <div class="tasktitle">${taskTitle(t)}</div>
      ${objLine(t)}
      <div class="taskmeta">Система: <b>${t.system}</b></div>
      ${t.note?`<div class="taskmeta">Примечание: ${t.note}</div>`:''}
      <div class="resp"><div class="resphead">Исполнители:</div>${resp||'—'}</div></div>`;
  }
  const period = (t.from||t.to) ? `<div class="taskmeta">Срок: <b>${t.from?fmtDate(t.from):'…'} — ${t.to?fmtDate(t.to):'…'}</b></div>` : '';
  const ext = t.extendedTo ? `<div class="taskmeta" style="color:#9a6a00">Продлено до: <b>${fmtDate(t.extendedTo)}</b></div>` : '';
  const narTxt = t.noNaryad ? 'без наряда' : (t.naryad||'');
  const nar = narTxt ? `<div class="taskmeta">Наряд: <b>${narTxt}</b></div>` : '';

    <div class="taskmeta">Исполнители: ${(t.assignees||[]).map(a=>a.name).join(', ')||'—'}</div>
    <div class="taskmeta">Инженер: ${t.engineer}</div>
    ${ext}`;
  // Инженер/Админ — полный контроль
  if(canAssign()){
    const resp = (t.assignees||[]).map(a=>{ const key=a.login||a.name; const st=statusOf(t,a);
      return `<div class="respline"><span>${a.name}</span><button class="st st-${st}" onclick="cycleStatus('${t.id}','${key.replace(/'/g,"\\'")}')">${stName(st)} ✎</button></div>`; }).join('');
    let foot = t.closed ? '<div class="closedtag">✔ Внесено в ежедневник</div>'

         <button class="save-btn" style="margin-top:8px" onclick="finishTask('${t.id}')">Завершить — внести в ежедневник</button>`;
    return `<div class="grp taskcard${t.closed?' closed':''}">${info}
      <div class="resp"><div class="resphead">Ответы (нажмите статус, чтобы изменить):</div>${resp||'—'}</div>
      ${foot}
      <div class="taskbtns"><button class="tbtn" onclick="editTask('${t.id}')">✎ Изменить</button><button class="tbtn del" onclick="deleteTask('${t.id}')">🗑 Удалить</button></div>
    </div>`;
  }
  // Начальник — только просмотр
  if(hasRole('Начальник')){
    const resp = (t.assignees||[]).map(a=>{ const st=statusOf(t,a);
      return `<div class="respline"><span>${a.name}</span><span class="st st-${st}">${stName(st)}</span></div>`; }).join('');
    return `<div class="grp taskcard${t.closed?' closed':''}">${info}
      <div class="resp"><div class="resphead">Ответы:</div>${resp||'—'}</div>
      ${t.closed?'<div class="closedtag">✔ Внесено в ежедневник</div>':''}</div>`;
  }
  // Сотрудник — две эмодзи
  const my = (t.status&&t.status[PROFILE.login||PROFILE.name]) || 'new';
  return `<div class="grp taskcard${t.closed?' closed':''}">
    <div class="taskrow"><div class="taskinfo">${info}</div>
      <div class="taskacts">
        <div class="emojiwrap"><button class="emoji${my==='done'?' on done':''}" onclick="setTaskStatus('${t.id}','done')" aria-label="Готово">✅</button><span class="cap">готово</span></div>
        <div class="emojiwrap"><button class="emoji${my==='prog'?' on prog':''}" onclick="setTaskStatus('${t.id}','prog')" aria-label="В процессе">🔄</button><span class="cap">в процессе</span></div>
      </div></div>
    ${t.closed?'<div class="closedtag">✔ Внесено в ежедневник</div>':''}</div>`;
}
function cycleStatus(id, key){ const t=TASKS.find(x=>x.id===id); if(!t) return;
  const order=['new','prog','done']; t.status=t.status||{}; const cur=t.status[key]||'new';
  t.status[key]=order[(order.indexOf(cur)+1)%3]; saveTasks(); renderTasks(); }
function editTask(id){ const t=TASKS.find(x=>x.id===id); if(!t) return;
  newTask={ id:t.id, kind:t.kind||'reg', system:t.system, object:t.object, objects:taskObjs(t).slice(), from:t.from||'', to:t.to||'', naryad:t.naryad||'', noNaryad:!!t.noNaryad, assignees:(t.assignees||[]).map(a=>({id:(ACCOUNTS.find(x=>x.name===a.name)||{}).id, name:a.name, login:a.login})) };
  location.hash='newtask'; }
function deleteTask(id){ TASKS=TASKS.filter(x=>x.id!==id); saveTasks(); renderTasks(); renderTabbar(); toast('Задача удалена'); }
/* сопоставление системы и ключей */
const SYS_KEY = {'АПС':'aps','АОС':'aos','Видеонаблюдение':'video','ГГС':'ggs','СКУД':'skud'};
function ymdToDate(s){ const p=(s||'').split('-'); return (p.length===3)? new Date(+p[0], +p[1]-1, +p[2]) : new Date(today); }
function regDoneInMonth(sysKey, obj, y, m){
  const key = findRegKey(sysKey, obj); if(!key) return false;
  const days = new Date(y, m+1, 0).getDate();
  for(let n=1; n<=days; n++){ const set = CHECKS[`${y}-${pad2(m+1)}-${pad2(n)}`]; if(set && set.has(key)) return true; }
  return false;
}
function objectsForTask(sysName, kind, m, y){
  const key = SYS_KEY[sysName]; if(!key) return [];
  if(typeof m!=='number') m = today.getMonth();
  if(typeof y!=='number') y = today.getFullYear();
  if(kind==='zay'){ const out=[]; (ZAY[key]||[]).forEach(sec=>sec.subs.forEach(sb=>sb.items.forEach(x=>{ if(!out.includes(x)) out.push(x); }))); return out; }
  const out=[];
  (REG[key]?REG[key].systems:[]).forEach(sys=>sys.groups.forEach(g=>{ if(g.months.includes(m)) g.items.forEach(x=>{ if(!out.includes(x) && !regDoneInMonth(key, x, y, m)) out.push(x); }); }));
  return out;
}
function findRegKey(sysKey, obj){ let r=null; (REG[sysKey]?REG[sysKey].systems:[]).forEach(sys=>sys.groups.forEach(g=>{ if(!r && g.items.includes(obj)) r=`reg|${sysKey}|${sys.name}|${obj}`; })); return r; }
function findZayKey(sysKey, obj){ let r=null; (ZAY[sysKey]||[]).forEach(sec=>sec.subs.forEach(sb=>{ if(!r && sb.items.includes(obj)) r=`zay|${sysKey}|${sec.name}|${sb.name}|${obj}`; })); return r; }
function dayKToTime(k){ const p=(k||'').split('-'); return p.length===3 ? new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime() : Date.now(); }
function syncDiaryToTask(key, dayK){
  if(typeof TASKS==='undefined') return;
  const id = 'd|'+dayK+'|'+key;
  const set = checkSet(dayK);
  const idx = TASKS.findIndex(t=>t.id===id);
  if(!set.has(key)){ if(idx>=0){ TASKS.splice(idx,1); saveTasks(); if(location.hash.slice(1)==='tasks') renderTasks(); } return; }
  const o = parseKey(key);
  const kind = key.indexOf('zay|')===0 ? 'zay' : 'reg';
  const rec = metaOf(dayK)[key] || {};
  const assignees = (rec.w||[]).map(n=>({name:n, login:(ACCOUNTS.find(a=>a.name===n)||{}).login||''}));
  const status={}; assignees.forEach(a=>status[a.login||a.name]='done');
  const t = { id, kind, system:o.sys, object:o.obj, objects:[o.obj], assignees, engineer:(PROFILE&&PROFILE.name)||'', engineerLogin:(PROFILE&&PROFILE.login)||'', status, closed:true, source:'diary', day:dayK, note:(rec.note||''), created:dayKToTime(dayK) };
  if(idx>=0) TASKS[idx]=t; else TASKS.push(t);
  saveTasks(); if(location.hash.slice(1)==='tasks') renderTasks();
}
async function finishTask(id){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  const sk=SYS_KEY[t.system];
  const objs=taskObjs(t);
  if(!objs.length){ toast('Нет объектов'); return; }
  // дата записи — срок «с», иначе сегодня
  const dd = (t.from && /^\d{4}-\d{2}-\d{2}$/.test(t.from)) ? ymdToDate(t.from) : new Date();
  const k = dd.getFullYear()+'-'+pad2(dd.getMonth()+1)+'-'+pad2(dd.getDate());
  try{ await loadDayChecks([dd]); await loadDayMeta([dd]); }catch(e){}
  const set=checkSet(k);
  const engNames = new Set(ACCOUNTS.filter(a=>rolesOf(a).includes('Инженер')||rolesOf(a).includes('Администратор')).map(a=>a.name));
  const w=(t.assignees||[]).map(a=>a.name).filter(n=> n!==t.engineer && !engNames.has(n));
  const meta=metaOf(k);
  const tFrom = t.from||'', tTo = (t.extendedTo||t.to||'');
  let done=0; const missed=[];
  objs.forEach(obj=>{
    const key = t.kind==='zay' ? findZayKey(sk, obj) : findRegKey(sk, obj);
    if(!key){ missed.push(obj); return; }
    set.add(key);
    const nar = t.noNaryad ? 'без наряда' : (t.naryad||(meta[key]&&meta[key].n)||'');
    meta[key]={ w:w, n:nar, note: (meta[key]&&meta[key].note)||'', from: tFrom, to: tTo };
    done++;
  });
  saveChecks(k); saveMeta(k);
  t.closed=true; saveTasks(); renderTasks(); renderTabbar();
  if(missed.length) toast('Внесено на '+fmtDate(k)+': '+done+'. Не сопоставлено: '+missed.join(', '));
  else toast('Внесено в ежедневник на '+fmtDate(k)+' ('+done+' об.)');
}
function extendTask(id){
  const el=document.getElementById('ext_'+id); const v=el?el.value:'';
  if(!v){ toast('Выберите дату продления'); return; }
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  t.extendedTo=v; t.closed=false; saveTasks(); renderTasks(); renderTabbar();
  toast('Продлено до '+fmtDate(v));
}
function setTaskStatus(id, code){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  t.status = t.status||{}; t.status[PROFILE.login||PROFILE.name]=code;
  saveTasks(); renderTasks(); renderTabbar();
  toast(code==='done'?'Отмечено: закончено':'Отмечено: в процессе');
}

function ntAddObj(){ const sel=document.getElementById('ntObjSel'); const v=sel?sel.value:''; if(!v){ toast('Выберите объект из списка'); return; }
  if(!Array.isArray(newTask.objects)) newTask.objects=[];

  const i=newTask.assignees.findIndex(x=>x.id===id);
  if(i>=0) newTask.assignees.splice(i,1); else newTask.assignees.push({id:a.id,name:a.name,login:a.login});

function goTasks(){ location.hash='tasks'; try{ route(true); }catch(e){} }
function ntSay(msg,ok){ const el=document.getElementById('ntMsg'); if(el){ el.textContent=msg; el.style.color = ok?'#2f8a4e':'var(--accent)'; } toast(msg); }
function createTask(){
  if(!newTask){ ntSay('Форма сброшена, откройте заново'); goTasks(); return; }
  // собираем объекты (до 6); если ничего не добавлено — берём выбранный в списке
  let objs = Array.isArray(newTask.objects) ? newTask.objects.slice() : [];
  if(!objs.length){ const sel=document.getElementById('ntObjSel'); if(sel&&sel.value) objs=[sel.value]; }
  objs = objs.map(o=>(o||'').trim()).filter(Boolean).slice(0,6);
  if(!objs.length){ ntSay('⚠️ Добавьте хотя бы один объект'); return; }
  if(!newTask.assignees.length){ ntSay('⚠️ Отметьте хотя бы одного исполнителя'); return; }
  try{
    if(!Array.isArray(TASKS)||!Object.isExtensible(TASKS)) TASKS = Array.isArray(TASKS)?fresh(TASKS):[];
    if(newTask.id){ const idx=TASKS.findIndex(x=>x.id===newTask.id);
      if(idx>=0){ const t=fresh(TASKS[idx]); t.kind=newTask.kind; t.system=newTask.system; t.objects=objs; t.object=objs[0]; t.assignees=newTask.assignees.map(a=>({name:a.name,login:a.login})); t.from=newTask.from||''; t.to=newTask.to||''; t.naryad=newTask.noNaryad?'':(newTask.naryad||'').trim(); t.noNaryad=!!newTask.noNaryad; TASKS[idx]=t; }
      saveTasks(); ntSay('Задача изменена',1); goTasks(); return; }
    TASKS.push({ id:'t'+Date.now(), kind:newTask.kind, system:newTask.system, object:objs[0], objects:objs,
      assignees:newTask.assignees.map(a=>({name:a.name,login:a.login})),
      from:newTask.from||'', to:newTask.to||'',
      naryad:newTask.noNaryad?'':(newTask.naryad||'').trim(), noNaryad:!!newTask.noNaryad,
      engineer:(PROFILE&&PROFILE.name)||'', engineerLogin:(PROFILE&&PROFILE.login)||'', status:{}, created:Date.now() });
    saveTasks(); ntSay('✅ Задача создана ('+objs.length+' объект.)',1); goTasks();
  }catch(err){ ntSay('Ошибка: '+(err&&err.message||err)); }
}

  </div>`;

function updUser(f, v){ const a=ACCOUNTS.find(x=>x.id===state.editId); if(!a) return; a[f]=v;
  if(a.id===PROFILE.id){ PROFILE=a; try{localStorage.setItem('previewProfile',JSON.stringify(a));}catch(e){} }
  saveAccounts(); }
function toggleRole(r){ const a=ACCOUNTS.find(x=>x.id===state.editId); if(!a) return;
  if(!Array.isArray(a.roles)) a.roles = a.role?[a.role]:[];
  const i=a.roles.indexOf(r);
  if(i>=0) a.roles.splice(i,1); else { if(a.roles.length>=2){ toast('Максимум 2 роли'); return; } a.roles.push(r); }
  if(!a.roles.length) a.roles=['Сотрудник'];
  if(a.id===PROFILE.id){ PROFILE=a; try{localStorage.setItem('previewProfile',JSON.stringify(a));}catch(e){} }
  saveAccounts(); renderEditUser(); }
function delUser(id){ ACCOUNTS=ACCOUNTS.filter(x=>x.id!==id); saveAccounts(); if(PROFILE.id===id) PROFILE=ACCOUNTS[0]; location.hash='profile-users'; toast('Аккаунт удалён'); }

let tt;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2200);
}
function route(keep){
  const h = location.hash.slice(1);
  renderTabbar();
  if(h==='tasks'){ renderTasks(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='newtask'){ if(!newTask) newTask={system:'АПС',object:'',assignees:[]}; renderNewTask(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile'){ renderProfile(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile-users'){ renderUsers(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='profile-user'){ renderEditUser(); if(!keep) window.scrollTo(0,0); return; }
  if(h==='zsub' && state.zs && state.day) renderZSub();
  else if(h==='sub' && state.sub && state.day) renderSub();
  else if(h==='menu' && state.day && state.mode) renderMenu();
  else if(h==='nar' && state.day) renderNar();
  else if(h==='plan' && state.day) renderPlan();
  else if(h==='notif') renderNotif();
  else if(h==='item' && state.day && state.itemKey && state.mode) renderItem();
  else if(h==='week' && state.weekStart!==null) renderWeek();
  else if(h==='month') renderMonth();
  else renderYear();
  if(!keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
if(location.hash && location.hash!=='#') { try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
if((!location.hash || location.hash==='#') && isEmployeeOnly()){ try{ location.hash='tasks'; }catch(e){} }
route();
(function(){ const a=document.getElementById('app'); let sx=0,sy=0;
  a.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  a.addEventListener('touchend',e=>{ const h=location.hash.slice(1);
    if(!(h===''||h==='tasks'||h==='profile')) return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8){ const o=tabOrder(); let i=o.indexOf(curTab());
      if(dx<0&&i<o.length-1) goTab(o[i+1]); else if(dx>0&&i>0) goTab(o[i-1]); } },{passive:true});
})();
setTimeout(()=>{ const sp = document.getElementById('splash'); if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(), 600); } }, 1800);
</script>
