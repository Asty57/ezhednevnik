name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Определить версию
        id: ver
        run: echo "v=$(grep -oP 'versionName \"\K[^\"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Собрать APK
        run: gradle assembleRelease --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "Ezhednevnik-${{ steps.ver.outputs.v }}.apk"

      - name: Сохранить APK в Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ezhednevnik-${{ steps.ver.outputs.v }}
          path: Ezhednevnik-${{ steps.ver.outputs.v }}.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Ежедневник ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: Ezhednevnik-${{ steps.ver.outputs.v }}.apk
          make_latest: true
