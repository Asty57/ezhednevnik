name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleRelease --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "Ezhednevnik-2.0.1.apk"

      - name: Сохранить APK в Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ezhednevnik-2.0.1
          path: Ezhednevnik-2.0.1.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: Ежедневник 2.0.1
          body_path: RELEASE_NOTES.md
          files: Ezhednevnik-2.0.1.apk
